<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palm Villa Outstanding Accounts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #071026 0%, #0b1220 100%);
            color: #f8fafc;
        }
        .container {
            width: min(1100px, 92%);
            margin: 40px auto 80px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin: 20px 0;
        }
        .summary-box {
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
            border: 1px solid rgba(250,204,21,0.12);
            border-radius: 18px;
            padding: 22px 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .summary-box span {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .summary-box strong {
            font-size: 1.75rem;
            color: #facc15;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin: 18px 0 8px;
        }
        .filters input,
        .filters select,
        .filters button {
            min-height: 44px;
        }
        .filters input,
        .filters select {
            flex: 1 1 200px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148,163,184,0.2);
            background: #0f172a;
            color: #f8fafc;
            box-sizing: border-box;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .ledger-item {
            background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.98));
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 18px;
            padding: 20px;
            margin-top: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .ledger-item h3 {
            margin: 0 0 10px;
            color: #facc15;
        }
        .ledger-meta {
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .ledger-orders {
            margin: 14px 0;
            padding-left: 18px;
            color: #f8fafc;
        }
        .ledger-orders li {
            margin: 8px 0;
        }
        .payment-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .outstanding-amount {
            color: #fca5a5;
            font-weight: 800;
            margin-top: 12px;
        }
        .paid-amount {
            color: #86efac;
            font-weight: 800;
        }
        @media (max-width: 720px) {
            .container { width: min(96%, 100%); margin-top: 24px; }
            .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .summary-box strong { font-size: 1.3rem; }
            .payment-row { flex-direction: column; align-items: stretch; }
            .payment-row button, .payment-row a { width: 100%; }
            .filters { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Outstanding Accounts</h1>
            <p>Track what each customer still owes and what was bought.</p>
        </div>

        <div class="card">
            <div class="summary-grid">
                <div class="summary-box">
                    <span>Total Outstanding</span>
                    <strong id="totalDebt">₦0</strong>
                </div>
                <div class="summary-box">
                    <span>Cash Collected Today</span>
                    <strong id="cashToday">₦0</strong>
                </div>
                <div class="summary-box">
                    <span>Total Credit Sales</span>
                    <strong id="creditSales">₦0</strong>
                </div>
                <div class="summary-box">
                    <span>Debtors</span>
                    <strong id="debtorCount">0</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="filters">
                <input id="customerSearch" type="text" placeholder="Search customer or table..." />
                <select id="statusFilter">
                    <option value="all">All customers</option>
                    <option value="owing">Outstanding only</option>
                    <option value="paid">Fully settled</option>
                </select>
                <button type="button" onclick="window.print()">🖨 Print Ledger</button>
                <button type="button" id="exportLedgerBtn">📥 Export CSV</button>
            </div>
        </div>

        <div class="card">
            <div id="debtsList"></div>
        </div>

        <div class="buttons">
            <a href="./index.html" class="button-link">🏠 Back to Manager POS</a>
            <button type="button" onclick="PalmVillaApi.logout()">Sign out</button>
        </div>
    </div>

    <script src="./api.js"></script>
    <script src="./debts.js"></script>
</body>
</html>
